services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-precut}
      POSTGRES_USER: ${DB_USER:-precut}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-precut}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-precut} -d ${DB_NAME:-precut}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:

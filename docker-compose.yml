services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-precut}
      POSTGRES_USER: ${DB_USER:-precut}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-precut} -d ${DB_NAME:-precut}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      SCHEMA_PATH: /app/src/schema.sql
      PREVIEWS_DIR: /app/data/previews
    volumes:
      - previews:/app/data/previews
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  previews:
